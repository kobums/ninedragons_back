services:
  back:
    # 운영 이미지 이름은 언더스코어다. 하이픈(ninedragons-back)은 존재하지 않는다.
    image: kobums/ninedragons_back:${VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ninedragons-back
    ports:
      - '8003:8003'
    restart: unless-stopped
    environment:
      # 참가/게임시작 운영자 알림. 토픽이 비어 있으면 발송하지 않는다.
      - NTFY_TOPIC=${NTFY_TOPIC:-}
      - NTFY_SERVER=${NTFY_SERVER:-https://ntfy.sh}
    networks:
      - ninedragons-network
    volumes:
      - /home/ninedragons-back/webdata:/usr/local/main/webdata

networks:
  ninedragons-network:
    driver: bridge
